name: Desktop agent packages
on:
  pull_request:
    paths: ['agent/desktop/**', 'tests/test_desktop_agent.py', '.github/workflows/desktop-agent.yml']
  push:
    tags: ['desktop-agent-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r agent/desktop/requirements.txt pyinstaller==6.20.0
      - run: python -m unittest discover -s tests -p test_desktop_agent.py -v
      - name: Bundle agent and updater dependencies
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = Windows ]; then EXTRA="--hidden-import win32timezone --hidden-import win32serviceutil --hidden-import servicemanager"; fi
          pyinstaller --clean --onefile --name rrm-agent --paths agent/desktop --add-data 'agent/desktop/version.txt:.' --add-data 'agent/desktop/release-public-key.txt:.' $EXTRA agent/desktop/main.py
      - name: Frozen binary smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then dist/rrm-agent.exe --self-test; else dist/rrm-agent --self-test; fi
      - name: Real Windows service installation and process query
        if: runner.os == 'Windows'
        run: python agent/desktop/smoke_service.py dist/rrm-agent.exe
      - name: Real macOS launchd installation and process query
        if: runner.os == 'macOS'
        run: sudo "$(which python)" agent/desktop/smoke_service.py dist/rrm-agent
      - run: python agent/desktop/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: desktop-dist/*.zip
  release:
    if: github.repository == 'GoetschiM/rrm-desktop-agent' && startsWith(github.ref, 'refs/tags/desktop-agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: desktop-dist
          merge-multiple: true
      - run: pip install cryptography
      - name: Validate tag and sign manifest
        env:
          AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          test "$GITHUB_REF_NAME" = "desktop-agent-v$(cat agent/desktop/version.txt)"
          python agent/desktop/package.py --sign
      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" desktop-dist/* --verify-tag --title "Desktop Agent $(cat agent/desktop/version.txt)" --notes 'Windows x64 and macOS Intel/Apple Silicon. Signed automatic updates every 15 minutes.'
  verify-upgrade:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r agent/desktop/requirements.txt pyinstaller==6.20.0
      - name: Build preceding-version pilot with the same pinned root
        shell: bash
        run: |
          echo '0.9.999' > agent/desktop/version.txt
          EXTRA=""
          if [ "${{ runner.os }}" = Windows ]; then EXTRA="--hidden-import win32timezone --hidden-import win32serviceutil --hidden-import servicemanager"; fi
          pyinstaller --clean --onefile --name rrm-agent --paths agent/desktop --add-data 'agent/desktop/version.txt:.' --add-data 'agent/desktop/release-public-key.txt:.' $EXTRA agent/desktop/main.py
      - name: Windows real signed upgrade
        if: runner.os == 'Windows'
        run: python agent/desktop/smoke_service.py dist/rrm-agent.exe --upgrade
      - name: macOS real signed upgrade
        if: runner.os == 'macOS'
        run: sudo "$(which python)" agent/desktop/smoke_service.py dist/rrm-agent --upgrade
