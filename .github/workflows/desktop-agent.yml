name: Desktop agent packages
on:
  pull_request:
  push:
    tags: ['desktop-agent-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-pr:
    runs-on: [self-hosted, linux, x64, rrm-ci]
    timeout-minutes: 20
    outputs:
      uploaded: ${{ steps.artifacts.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/desktop-go/go.mod
          cache-dependency-path: agent/desktop-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Legacy installer and manifest compatibility tests
        run: |
          pip install -r agent/desktop/requirements.txt
          python -m unittest discover -s tests -p test_desktop_agent.py -v
      - name: Go contracts, updater rollback and monitoring
        working-directory: agent/desktop-go
        run: |
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -race ./...
      - name: Build and package all desktop targets on CT128
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION=$(cat agent/desktop/version.txt)
          mkdir -p dist desktop-dist
          cd agent/desktop-go
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$VERSION" -o ../../dist/rrm-agent.exe .
          cd ../..
          python agent/desktop/package.py --target windows-x64
          cd agent/desktop-go
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$VERSION" -o ../../dist/rrm-agent .
          cd ../..
          python agent/desktop/package.py --target macos-x64
          cd agent/desktop-go
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-X main.version=$VERSION" -o ../../dist/rrm-agent .
          go build -trimpath -ldflags "-X main.version=$VERSION" -o ../../dist/rrm-agent-linux-check .
          cd ../..
          python agent/desktop/package.py --target macos-arm64
          dist/rrm-agent-linux-check --self-test
          file dist/*
          sha256sum desktop-dist/*
      - name: Retain packages locally on CT128
        run: |
          LOCAL="$HOME/rrm-builds/$GITHUB_REPOSITORY/$GITHUB_SHA"
          mkdir -p "$LOCAL"
          cp desktop-dist/*.zip "$LOCAL/"
          echo "Linux cross-build packages retained on CT128: $LOCAL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: desktop-agent-packages
          path: desktop-dist/*.zip
          retention-days: 7
      - name: Report artifact availability separately from build success
        if: always()
        run: |
          echo "Package upload: ${{ steps.artifacts.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Native Windows SCM / macOS launchd acceptance must run on target devices before release." >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.repository == 'GoetschiM/rrm-desktop-agent' && startsWith(github.ref, 'refs/tags/desktop-agent-v') && needs.verify-pr.outputs.uploaded == 'success'
    needs: verify-pr
    runs-on: [self-hosted, linux, x64, rrm-ci]
    permissions:
      contents: write
    environment: desktop-agent-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-agent-packages
          path: desktop-dist
      - run: pip install cryptography
      - name: Sign complete manifest
        env:
          AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          test "$GITHUB_REF_NAME" = "desktop-agent-v$(cat agent/desktop/version.txt)"
          python agent/desktop/package.py --sign
      - name: Publish signed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" desktop-dist/* --verify-tag --title "Desktop Agent $(cat agent/desktop/version.txt)" --notes 'Go agent cross-built on CT128 for Windows x64 and macOS Intel/Apple Silicon.'
